const SITE_LS = "nc04_site_k";

async function reveal(bits) {
  const raw = Uint8Array.from(atob(CT), ch => ch.charCodeAt(0));
  const ct = raw.slice(16);
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct);
  return new TextDecoder().decode(pt);
}

async function unlock() {
  const pass = document.getElementById("pw").value;
  const err = document.getElementById("err");
  try {
    const raw = Uint8Array.from(atob(CT), ch => ch.charCodeAt(0));
    const salt = raw.slice(8, 16);
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, km, 384));
    const html = await reveal(bits);
    try {
      localStorage.setItem(SITE_LS, JSON.stringify(
        { k: btoa(String.fromCharCode(...bits)), exp: Date.now() + 30 * 864e5 }));
    } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = "Wrong password.";
  }
}

async function tryStored() {
  try {
    const s = JSON.parse(localStorage.getItem(SITE_LS) || "null");
    if (!s || s.exp < Date.now()) { localStorage.removeItem(SITE_LS); return; }
    const bits = Uint8Array.from(atob(s.k), ch => ch.charCodeAt(0));
    const html = await reveal(bits);
    document.open(); document.write(html); document.close();
  } catch (e) { try { localStorage.removeItem(SITE_LS); } catch (e2) {} }
}
if (document.readyState === "complete") { tryStored(); }
else { window.addEventListener("load", tryStored); }
